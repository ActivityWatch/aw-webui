name: Dependabot Auto-merge

# Run in the trusted `workflow_run` context and merge Dependabot PRs directly
# with the repository token instead of depending on an external PAT.

on:
  workflow_run:
    types:
      - completed
    workflows:
      # List all required workflow names here.
      - Build

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  auto_merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.actor == 'dependabot[bot]'

    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests?.[0];
            if (!pr) {
              core.setFailed("No pull request found in workflow_run payload.");
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            if (pull.merged) {
              // Re-running this job after a failed dispatch lands here: skip
              // the merge but still dispatch the master checks below.
              core.info(`PR #${pull.number} is already merged; dispatching checks.`);
            } else if (pull.state !== "open") {
              core.info(`PR #${pull.number} is already ${pull.state}; nothing to do.`);
              return;
            } else if (pull.draft) {
              core.info(`PR #${pull.number} is a draft; skipping.`);
              return;
            } else {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                merge_method: "squash",
                sha: context.payload.workflow_run.head_sha,
              });

              core.info(`Merged Dependabot PR #${pull.number}.`);
            }

            // A merge made with the repository token starts no `push` workflows,
            // so the squash commit would land on master without Build, Lint or
            // CodeQL. `workflow_dispatch` is the documented exception: dispatch
            // the master checks explicitly. Each workflow's concurrency group
            // collapses a burst of merges to the newest master commit.
            for (const workflow_id of ["nodejs.yml", "lint.yml", "codeql.yml"]) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: "master",
              });
            }
            core.info("Dispatched master Build, Lint and CodeQL.");
