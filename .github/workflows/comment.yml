# NOTE: For screenshots to work in untrusted PRs we need to do the screenshot comment in a trusted job like this one.
#       See this post for details: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

name: Comment

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    # TODO: Maybe add `github.event.workflow_run.event == 'pull_request'` to avoid spam?

    steps:
    - uses: actions/checkout@v7
    # setup-cml@v3 still queries GitHub's unauthenticated releases API:
    # it constructs Octokit with `token:` (ignored; the option is `auth:`),
    # so GITHUB_TOKEN does not lift the shared runner-IP quota. Pin the
    # linux-x64 binary instead of calling /releases/latest.
    # sha256 of iterative/cml v0.20.6 cml-linux-x64.
    - name: Install CML
      run: |
        curl -fsSL -o "$RUNNER_TEMP/cml" \
          https://github.com/iterative/cml/releases/download/v0.20.6/cml-linux-x64
        echo "74621a15b0c2cdd2b7751c5eb91228b10661fb0ec21b1564d1146820b5792655  $RUNNER_TEMP/cml" \
          | sha256sum -c -
        chmod +x "$RUNNER_TEMP/cml"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    # Link GitHub's existing archives instead of publishing each image to
    # CML's deprecated upload service. No untrusted archive extraction needed.
    - name: List screenshot artifacts
      uses: actions/github-script@v9
      env:
        SCREENSHOT_RUN_ID: ${{ github.event.workflow_run.id }}
      with:
        script: |
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: Number(process.env.SCREENSHOT_RUN_ID),
            per_page: 100,
          });
          require('fs').writeFileSync('screenshot-artifacts.json', JSON.stringify(artifacts));

    - name: Compose comment
      env:
        SCREENSHOT_RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        python3 .github/compose_screenshot_comment.py > comment.md
    - name: Post screenshots in commit comment
      env:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        head_sha: ${{ github.event.workflow_run.head_sha }}
      run: |
        cml comment create --target=commit/$head_sha --repo https://github.com/${{ github.repository }} comment.md
